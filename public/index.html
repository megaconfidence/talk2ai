<!doctype html>
<html lang="en" data-phase="idle" data-call="idle">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Voice — talk to AI in real time</title>
		<meta name="description" content="A real-time voice assistant running entirely on Cloudflare Workers." />
		<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<style>
			/* ---------------------------------------------------------------- *
			 * Tokens
			 * ---------------------------------------------------------------- */
			:root {
				color-scheme: light dark;

				--font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				--font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

				--bg: #f4f4f6;
				--surface: #ffffff;
				--surface-2: #fbfbfc;
				--border: #e7e7eb;
				--border-strong: #d6d6dd;
				--text: #0d0d11;
				--text-muted: #6d6d79;
				--text-faint: #a6a6b2;

				--bubble-user-bg: #131317;
				--bubble-user-fg: #ffffff;
				--bubble-ai-bg: #f1f1f4;
				--bubble-ai-fg: #16161b;

				--accent: #f6821f;
				--accent-soft: rgb(246 130 31 / 0.13);
				--speak: #2f9e68;
				--speak-soft: rgb(47 158 104 / 0.13);
				--danger: #e0484d;
				--danger-soft: rgb(224 72 77 / 0.11);

				--btn-fg: #ffffff;
				--btn-bg: #131317;
				--btn-bg-hover: #2a2a32;

				--radius-sm: 9px;
				--radius: 13px;
				--radius-lg: 22px;

				--shadow-card: 0 1px 2px rgb(10 10 15 / 0.04), 0 12px 28px -10px rgb(10 10 15 / 0.1), 0 32px 64px -32px rgb(10 10 15 / 0.16);
				--shadow-btn: 0 1px 2px rgb(10 10 15 / 0.12), 0 1px 1px rgb(10 10 15 / 0.06);

				--wave: var(--text-faint);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #08080a;
					--surface: #101014;
					--surface-2: #16161b;
					--border: #22222a;
					--border-strong: #2e2e38;
					--text: #f2f2f5;
					--text-muted: #8b8b98;
					--text-faint: #55555f;

					--bubble-user-bg: #f2f2f5;
					--bubble-user-fg: #0b0b0e;
					--bubble-ai-bg: #1b1b21;
					--bubble-ai-fg: #e9e9ee;

					--accent: #ff9a3d;
					--accent-soft: rgb(255 154 61 / 0.15);
					--speak: #46c68a;
					--speak-soft: rgb(70 198 138 / 0.15);
					--danger: #ff6369;
					--danger-soft: rgb(255 99 105 / 0.14);

					--btn-fg: #0b0b0e;
					--btn-bg: #f2f2f5;
					--btn-bg-hover: #d9d9e0;

					--shadow-card: 0 1px 2px rgb(0 0 0 / 0.4), 0 16px 40px -12px rgb(0 0 0 / 0.6);
					--shadow-btn: 0 1px 2px rgb(0 0 0 / 0.4);
				}
			}

			/* ---------------------------------------------------------------- *
			 * Reset
			 * ---------------------------------------------------------------- */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			* {
				margin: 0;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			button {
				font: inherit;
				color: inherit;
				background: none;
				border: 0;
				padding: 0;
			}
			svg {
				display: block;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
				border-radius: 6px;
			}
			::selection {
				background: var(--accent-soft);
			}

			/* ---------------------------------------------------------------- *
			 * Shell
			 * ---------------------------------------------------------------- */
			body {
				font-family: var(--font-sans);
				font-size: 15px;
				line-height: 1.55;
				color: var(--text);
				background: var(--bg);
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				padding: 28px 20px;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			/* Soft accent glow so the canvas isn't a flat slab of grey. */
			body::before {
				content: '';
				position: fixed;
				inset: -20% 0 auto;
				height: 60vh;
				background: radial-gradient(60% 60% at 50% 0%, var(--accent-soft), transparent 70%);
				pointer-events: none;
				z-index: 0;
			}

			.app {
				position: relative;
				z-index: 1;
				width: 100%;
				max-width: 720px;
				height: min(100dvh - 112px, 860px);
				display: flex;
				flex-direction: column;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				box-shadow: var(--shadow-card);
				overflow: hidden;
			}

			/* ---------------------------------------------------------------- *
			 * Header
			 * ---------------------------------------------------------------- */
			.app-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 14px 18px;
				border-bottom: 1px solid var(--border);
				background: var(--surface);
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 11px;
				min-width: 0;
			}

			.brand-mark {
				display: grid;
				place-items: center;
				width: 36px;
				height: 36px;
				flex: none;
				border-radius: 11px;
				color: var(--btn-fg);
				background: var(--btn-bg);
				box-shadow: var(--shadow-btn);
			}

			.brand h1 {
				font-size: 15px;
				font-weight: 600;
				letter-spacing: -0.01em;
				line-height: 1.2;
			}

			.brand p {
				font-size: 12.5px;
				color: var(--text-muted);
				line-height: 1.3;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.conn {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				flex: none;
				padding: 5px 11px 5px 9px;
				border: 1px solid var(--border);
				border-radius: 999px;
				background: var(--surface-2);
				font-size: 12px;
				font-weight: 500;
				color: var(--text-muted);
				white-space: nowrap;
			}

			.conn-dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--text-faint);
				transition: background-color 0.25s ease;
			}

			.conn[data-online='true'] .conn-dot {
				background: var(--speak);
			}

			.conn[data-online='false'] .conn-dot {
				background: var(--accent);
				animation: blink 1.1s ease-in-out infinite;
			}

			/* ---------------------------------------------------------------- *
			 * Transcript
			 * ---------------------------------------------------------------- */
			.messages-wrap {
				position: relative;
				flex: 1;
				min-height: 0;
				display: flex;
			}

			.messages-wrap::before,
			.messages-wrap::after {
				content: '';
				position: absolute;
				left: 0;
				right: 0;
				height: 22px;
				pointer-events: none;
				z-index: 2;
			}
			.messages-wrap::before {
				top: 0;
				background: linear-gradient(var(--surface), transparent);
			}
			.messages-wrap::after {
				bottom: 0;
				background: linear-gradient(transparent, var(--surface));
			}

			.messages-area {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				overscroll-behavior: contain;
				scrollbar-gutter: stable;
				display: flex;
				flex-direction: column;
				gap: 8px;
				padding: 20px 18px;
			}

			.messages-area::-webkit-scrollbar {
				width: 10px;
			}
			.messages-area::-webkit-scrollbar-thumb {
				background: var(--border-strong);
				border-radius: 99px;
				border: 3px solid transparent;
				background-clip: content-box;
			}
			.messages-area::-webkit-scrollbar-thumb:hover {
				background: var(--text-faint);
				background-clip: content-box;
			}
			.messages-area {
				scrollbar-width: thin;
				scrollbar-color: var(--border-strong) transparent;
			}

			.message-bubble {
				max-width: 78%;
				padding: 9px 13px;
				border-radius: 16px;
				font-size: 14.5px;
				line-height: 1.5;
				overflow-wrap: anywhere;
				animation: bubble-in 0.26s cubic-bezier(0.22, 0.9, 0.28, 1) both;
				transition: opacity 0.2s ease;
			}

			.user-message {
				align-self: flex-end;
				background: var(--bubble-user-bg);
				color: var(--bubble-user-fg);
				border-bottom-right-radius: 5px;
			}

			.ai-message {
				align-self: flex-start;
				background: var(--bubble-ai-bg);
				color: var(--bubble-ai-fg);
				border-bottom-left-radius: 5px;
			}

			/* Live partial transcript — same slot as the user bubble it will
			   become, but outlined rather than filled so it never reads as a
			   committed turn. */
			.message-bubble.is-interim {
				background: none;
				color: var(--text-muted);
				border: 1px dashed var(--border-strong);
			}

			/* System notice (e.g. "chat cleared") — neither party said this. */
			.message-bubble.is-notice {
				align-self: center;
				max-width: 100%;
				background: none;
				color: var(--text-muted);
				font-size: 12.5px;
				padding: 4px 12px;
				border: 1px dashed var(--border-strong);
				border-radius: 999px;
			}

			/* Empty state, revealed only while the transcript has no children. */
			.empty-state {
				position: absolute;
				inset: 0;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 4px;
				padding: 24px;
				text-align: center;
				pointer-events: none;
				opacity: 1;
				transition: opacity 0.25s ease;
			}

			.messages-wrap:has(.messages-area:not(:empty)) .empty-state {
				opacity: 0;
			}

			.empty-state .icon {
				display: grid;
				place-items: center;
				width: 52px;
				height: 52px;
				margin-bottom: 10px;
				border-radius: 16px;
				color: var(--text-faint);
				background: var(--surface-2);
				border: 1px solid var(--border);
			}

			.empty-state strong {
				font-size: 15px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}

			.empty-state span {
				font-size: 13px;
				color: var(--text-muted);
				max-width: 34ch;
			}

			/* ---------------------------------------------------------------- *
			 * Dock: visualizer + status + controls
			 * ---------------------------------------------------------------- */
			.dock {
				border-top: 1px solid var(--border);
				background: var(--surface-2);
				padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
			}

			.voice-visualization-area {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 44px;
			}

			.voice-bars {
				--level: 0;
				--min: 0.24;
				display: flex;
				align-items: center;
				gap: 4px;
				height: 100%;
			}

			.voice-bar {
				width: 4px;
				height: 100%;
				border-radius: 3px;
				background: var(--wave);
				transform: scaleY(calc(var(--min) + (1 - var(--min)) * var(--w) * var(--level)));
				opacity: calc(0.42 + 0.58 * var(--level));
				transition:
					transform 0.09s linear,
					background-color 0.3s ease,
					opacity 0.2s linear;
				will-change: transform;
			}

			/* Idle: a flat, quiet baseline rather than a hidden element (no jump). */
			.voice-visualization-area[data-active='false'] .voice-bar {
				background: var(--border-strong);
				opacity: 0.85;
			}

			.status-line {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 7px;
				min-height: 20px;
				font-size: 13px;
				color: var(--text-muted);
			}

			.status-dot {
				width: 7px;
				height: 7px;
				flex: none;
				border-radius: 50%;
				background: var(--text-faint);
				transition: background-color 0.25s ease;
			}

			/* One phase drives both the dot and the waveform tint. */
			[data-phase='listening'],
			[data-phase='thinking'] {
				--wave: var(--accent);
			}
			[data-phase='speaking'] {
				--wave: var(--speak);
			}
			[data-phase='error'] {
				--wave: var(--danger);
			}

			[data-phase='listening'] .status-dot {
				background: var(--accent);
				animation: ping 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
			}
			[data-phase='thinking'] .status-dot {
				background: var(--accent);
			}
			[data-phase='speaking'] .status-dot {
				background: var(--speak);
			}
			[data-phase='error'] .status-dot {
				background: var(--danger);
			}

			[data-phase='error'] .status-text-area {
				color: var(--danger);
			}

			/* Animated ellipsis, shown only while the model is thinking. */
			.dots {
				display: none;
				align-items: center;
				gap: 3px;
			}
			[data-phase='thinking'] .dots {
				display: inline-flex;
			}
			.dots i {
				width: 3px;
				height: 3px;
				border-radius: 50%;
				background: currentColor;
				animation: dot 1.2s ease-in-out infinite;
			}
			.dots i:nth-child(2) {
				animation-delay: 0.15s;
			}
			.dots i:nth-child(3) {
				animation-delay: 0.3s;
			}

			.timer {
				display: none;
				font-family: var(--font-mono);
				font-size: 12px;
				font-variant-numeric: tabular-nums;
				color: var(--text-faint);
				padding-left: 4px;
			}
			[data-call='active'] .timer {
				display: inline;
			}

			.input-area {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				width: 100%;
			}

			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				height: 42px;
				padding: 0 18px;
				border-radius: var(--radius);
				font-size: 14px;
				font-weight: 500;
				letter-spacing: -0.005em;
				cursor: pointer;
				border: 1px solid transparent;
				transition:
					background-color 0.16s ease,
					color 0.16s ease,
					border-color 0.16s ease,
					transform 0.08s ease,
					opacity 0.16s ease;
			}

			.btn:active:not(:disabled) {
				transform: scale(0.975);
			}

			.btn:disabled {
				cursor: not-allowed;
				opacity: 0.45;
			}

			.btn svg {
				flex: none;
			}

			.btn-primary {
				background: var(--btn-bg);
				color: var(--btn-fg);
				box-shadow: var(--shadow-btn);
				min-width: 148px;
			}
			.btn-primary:hover:not(:disabled) {
				background: var(--btn-bg-hover);
			}

			.btn-danger {
				background: var(--danger-soft);
				color: var(--danger);
				border-color: color-mix(in srgb, var(--danger) 26%, transparent);
				min-width: 148px;
			}
			.btn-danger:hover:not(:disabled) {
				background: color-mix(in srgb, var(--danger) 18%, transparent);
			}

			.btn-ghost {
				background: var(--surface);
				color: var(--text-muted);
				border-color: var(--border);
			}
			.btn-ghost:hover:not(:disabled) {
				background: var(--surface);
				color: var(--text);
				border-color: var(--border-strong);
			}

			/* Only ever one of start/stop is meaningful — show that one. */
			[data-call='idle'] #stopButton,
			[data-call='active'] #startButton {
				display: none;
			}

			.rec-dot {
				width: 9px;
				height: 9px;
				border-radius: 2px;
				background: currentColor;
				animation: blink 1.4s ease-in-out infinite;
			}

			/* ---------------------------------------------------------------- *
			 * Footer
			 * ---------------------------------------------------------------- */
			.attribution {
				position: relative;
				z-index: 1;
				font-size: 12.5px;
				color: var(--text-muted);
				text-align: center;
			}
			.attribution a {
				color: var(--text);
				text-decoration: none;
				border-bottom: 1px solid var(--border-strong);
				padding-bottom: 1px;
				transition: border-color 0.16s ease;
			}
			.attribution a:hover {
				border-bottom-color: var(--accent);
			}

			/* ---------------------------------------------------------------- *
			 * Motion
			 * ---------------------------------------------------------------- */
			@keyframes bubble-in {
				from {
					opacity: 0;
					transform: translateY(6px) scale(0.985);
				}
			}
			@keyframes ping {
				0%,
				100% {
					box-shadow: 0 0 0 0 var(--accent-soft);
				}
				50% {
					box-shadow: 0 0 0 5px var(--accent-soft);
				}
			}
			@keyframes blink {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.35;
				}
			}
			@keyframes dot {
				0%,
				60%,
				100% {
					opacity: 0.25;
					transform: translateY(0);
				}
				30% {
					opacity: 1;
					transform: translateY(-2px);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}

			/* ---------------------------------------------------------------- *
			 * Small screens
			 * ---------------------------------------------------------------- */
			@media (max-width: 640px) {
				body {
					padding: 0;
					gap: 0;
					justify-content: stretch;
				}
				.app {
					flex: 1;
					height: auto;
					max-width: none;
					border-radius: 0;
					border: 0;
					box-shadow: none;
				}
				.brand p {
					display: none;
				}
				.messages-area {
					padding: 16px 14px;
				}
				.message-bubble {
					max-width: 86%;
				}
				.dock {
					padding: 12px 14px 14px;
				}
				/* Footer merges into the dock and carries the safe-area inset,
				   since it is the last thing above the home indicator. */
				.attribution {
					width: 100%;
					background: var(--surface-2);
					padding: 0 16px calc(14px + env(safe-area-inset-bottom));
				}
				.input-area {
					gap: 6px;
				}
				.btn {
					flex: 1;
					min-width: 0;
					padding: 0 12px;
				}
				.btn-ghost {
					flex: none;
					width: 42px;
					padding: 0;
				}
				.btn-ghost .btn-label {
					display: none;
				}
			}

			@media (min-width: 641px) {
				.messages-area {
					padding: 24px 22px;
					gap: 10px;
				}
				.message-bubble {
					font-size: 15px;
					padding: 10px 14px;
				}
				.dock {
					padding: 16px 22px 18px;
				}
				.voice-visualization-area {
					height: 52px;
				}
				.voice-bar {
					width: 5px;
				}
			}
		</style>
	</head>
	<body>
		<main class="app">
			<header class="app-header">
				<div class="brand">
					<span class="brand-mark" aria-hidden="true">
						<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
							<path d="M3 12h0" />
							<path d="M7.5 8.5v7" />
							<path d="M12 5v14" />
							<path d="M16.5 8.5v7" />
							<path d="M21 12h0" />
						</svg>
					</span>
					<div>
						<h1>Voice</h1>
						<p>Talk to AI, in real time</p>
					</div>
				</div>
				<span class="conn" id="connPill" data-online="false">
					<span class="conn-dot" aria-hidden="true"></span>
					<span id="connLabel">Connecting</span>
				</span>
			</header>

			<div class="messages-wrap">
				<div class="messages-area" id="messagesArea" role="log" aria-live="polite" aria-label="Conversation transcript"></div>
				<div class="empty-state" aria-hidden="true">
					<span class="icon">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
							<path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3Z" />
							<path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
							<path d="M12 17.5V21" />
						</svg>
					</span>
					<strong>Ready when you are</strong>
					<span>Hit start, allow microphone access, and just speak — the reply comes back as audio.</span>
				</div>
			</div>

			<div class="dock">
				<div class="voice-visualization-area" id="voiceVisualizationArea" data-active="false" aria-hidden="true">
					<div class="voice-bars" id="voiceBars">
						<span class="voice-bar" style="--w: 0.3"></span>
						<span class="voice-bar" style="--w: 0.44"></span>
						<span class="voice-bar" style="--w: 0.58"></span>
						<span class="voice-bar" style="--w: 0.76"></span>
						<span class="voice-bar" style="--w: 0.86"></span>
						<span class="voice-bar" style="--w: 0.98"></span>
						<span class="voice-bar" style="--w: 1"></span>
						<span class="voice-bar" style="--w: 0.95"></span>
						<span class="voice-bar" style="--w: 0.89"></span>
						<span class="voice-bar" style="--w: 0.72"></span>
						<span class="voice-bar" style="--w: 0.6"></span>
						<span class="voice-bar" style="--w: 0.41"></span>
						<span class="voice-bar" style="--w: 0.28"></span>
					</div>
				</div>

				<p class="status-line">
					<span class="status-dot" aria-hidden="true"></span>
					<span class="status-text-area" id="statusText" role="status">Connecting…</span>
					<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
					<span class="timer" id="callTimer" aria-hidden="true">0:00</span>
				</p>

				<div class="input-area">
					<button class="btn btn-primary" id="startButton" type="button">
						<svg
							width="17"
							height="17"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.9"
							stroke-linecap="round"
							aria-hidden="true"
						>
							<path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3Z" />
							<path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
							<path d="M12 17.5V21" />
						</svg>
						<span class="btn-label">Start conversation</span>
					</button>

					<button class="btn btn-danger" id="stopButton" type="button">
						<span class="rec-dot" aria-hidden="true"></span>
						<span class="btn-label">Stop conversation</span>
					</button>

					<button class="btn btn-ghost" id="clearChatButton" type="button" aria-label="Clear chat">
						<svg
							width="17"
							height="17"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.7"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M4 7h16" />
							<path d="M9.5 4.5h5" />
							<path d="M6.5 7l.72 11.1A2 2 0 0 0 9.2 20h5.6a2 2 0 0 0 2-1.9L17.5 7" />
							<path d="M10 11v5M14 11v5" />
						</svg>
						<span class="btn-label">Clear</span>
					</button>
				</div>
			</div>
		</main>
